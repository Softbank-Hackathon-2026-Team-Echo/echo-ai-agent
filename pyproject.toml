[project]
name = "echo-ai-agent"
version = "0.1.0"
description = "EchoPort AI 에이전트 러너: 샌드박스에서 점검·수정하고 결과를 WAS 에 낸다"
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.17.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_agent"]

[tool.uv]
# 공급망 대비: 이 날짜 이후에 올라온 배포본은 고르지 않는다. 올릴 때는 날짜를 함께 검토한다.
exclude-newer = "2026-10-21T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
strict = true
packages = ["echo_agent"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-rs"
testpaths = ["tests"]
markers = ["docker: 로컬 Docker 데몬이 필요한 시험(없으면 건너뜀)"]
